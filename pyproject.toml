[project]
name = "code-reviewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MustbeSarthak", email = "https://github.com/MustbeSarthak" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain",
    "langchain-groq",
    "langgraph",
    "mcp>=2,<3",
    "pydantic",
    "python-dotenv",
    "uvicorn>=0.52.4",
]

[project.scripts]
code-reviewer = "code_reviewer.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
